name: Refresh verified episode maps
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-episode-maps.yml'
      - 'scripts/refresh-episode-routes.cjs'

permissions:
  contents: write

concurrency:
  group: trytv-verified-episode-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and merge publisher-confirmed new episodes
        run: node scripts/refresh-episode-routes.cjs --per-source=3
      - name: Validate central map hashes and route indexes
        run: |
          node scripts/validate-episode-maps.cjs
          git diff --check
      - name: Publish updated maps for all TryTV installations
        shell: bash
        run: |
          if git diff --quiet -- trytv/work-routes trytv/work-maps; then
            echo "No new verified episodes. Central maps unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trytv/work-routes trytv/work-maps
          git commit -m "Refresh verified publisher episode maps"
          git push origin HEAD:main
